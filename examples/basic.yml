# Basic — start here.
#
# Comments on hotspots, never fails the build. Run this for a week or two and
# see what it flags before you consider turning enforcement on.
#
# Copy to .github/workflows/hotspot.yml

name: Hotspot

on: pull_request

# Two runs on the same PR (a push landing next to a label change) would otherwise
# race on delete-then-post and leave duplicate comments. This cancels the
# superseded run, and saves CI minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # required — the action posts inline review comments

jobs:
  hotspot:
    name: Hotspot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # REQUIRED. Without full history the tool cannot measure how often
          # files change, and results will be wrong or empty.
          fetch-depth: 0

      - uses: zubairriaz/hotspot-tool@v1
        with:
          enforcement-level: warn

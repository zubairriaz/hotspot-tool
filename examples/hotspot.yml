# ─────────────────────────────────────────────────────────────────────────────
# hotspot-tool — quick setup
#
# Copy this file to .github/workflows/hotspot.yml and it works as-is.
# The `hotspot` job below is the one you want. The extra jobs at the bottom are
# commented-out variants — uncomment whichever matches your situation.
#
# Docs: https://github.com/zubairriaz/hotspot-tool
# ─────────────────────────────────────────────────────────────────────────────

name: Hotspot

on: pull_request

permissions:
  contents: read
  pull-requests: write   # required — the action posts inline review comments

jobs:
  hotspot:
    name: Hotspot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # REQUIRED. Without full history the tool cannot measure how often
          # files change, and results will be wrong or empty.
          fetch-depth: 0

      - uses: zubairriaz/hotspot-tool@main
        id: hotspot
        with:
          # info  — report only, no comments, never fails
          # warn  — inline comments, never fails   (start here)
          # block — inline comments, fails the check on a violation
          enforcement-level: warn

      # Optional: keep the report for trend tracking.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hotspot-report
          path: hotspot-report.json


